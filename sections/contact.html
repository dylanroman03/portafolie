<div class="flex items-center gap-4 mb-2">
    <h2 class="text-3xl font-bold mb-1" style="color:var(--color-title)">Contact me</h2>
    <span class="hidden md:inline-block flex-1 h-px" style="background:var(--color-border)"></span>
</div>
<div class="[background-color:var(--color-primary)] w-20 h-1 rounded mb-4"></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-10 scroll-reveal opacity-0 translate-y-8 transition duration-700">
    <div>
        <div class="mb-6 text-sm" style="color:var(--color-text-secondary)">
            Send me a message, I’ll get back to you as soon as possible.
        </div>
        <div class="flex items-center gap-3 mb-3">
            <i class="fa-solid fa-envelope text-[var(--color-primary)]"></i>
            <span class="font-mono" style="color:var(--color-secondary)"><b>Email</b></span>
        </div>
        <div class="ml-7 mb-4 text-sm select-all" style="color:var(--color-text-secondary)">
            romand.buitrago+dev@gmail.com
        </div>
        <div class="flex items-center gap-3 mb-3">
            <i class="fa-solid fa-location-dot text-[var(--color-primary)]"></i>
            <span class="font-mono" style="color:var(--color-secondary)"><b>Location</b></span>
        </div>
        <div class="ml-7 mb-4 text-sm" style="color:var(--color-text-secondary)">Táchira, Venezuela</div>
        <div class="font-semibold mt-8 mb-2" style="color:var(--color-title)">My Links</div>
        <div class="flex gap-3 mt-3">
            <a href="https://github.com/dylanroman03"
               class="w-10 h-10 flex items-center justify-center rounded-full"
               style="background:var(--color-border); color:var(--color-title)"><i class="fab fa-github"></i></a>
            <a href="https://ve.linkedin.com/in/dylan-roman-buitrago-5193092a7"
               class="w-10 h-10 flex items-center justify-center rounded-full"
               style="background:var(--color-border); color:var(--color-title)"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:romand.buitrago+dev@gmail.com"
               class="w-10 h-10 flex items-center justify-center rounded-full"
               style="background:var(--color-border); color:var(--color-title)"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </div>
    <div class="scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <form action="https://api.web3forms.com/submit" method="POST"
              class="rounded-xl px-8 py-8 flex flex-col gap-5 shadow-lg"
              style="background:var(--color-card); border:1px solid var(--color-border)">
            <input type="hidden" name="access_key" value="c3331af5-62a3-4870-a384-29b0a38a1efc">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-mono text-sm mb-1" style="color:var(--color-title)">Your Name</label>
                    <input type="text" placeholder="John Smith" name="name"
                           class="w-full rounded-lg px-4 py-2 outline-none transition"
                           style="background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-title)"
                           required/>
                </div>
                <div>
                    <label class="block font-mono text-sm mb-1" style="color:var(--color-title)">Your Email</label>
                    <input type="email" placeholder="john_smith@example.com" name="email"
                           class="w-full rounded-lg px-4 py-2 outline-none transition"
                           style="background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-title)"
                           required/>
                </div>
            </div>
            <div>
                <label class="block font-mono text-sm mb-1" style="color:var(--color-title)">Subject</label>
                <input type="text" placeholder="How can I help you?"
                       class="w-full rounded-lg px-4 py-2 outline-none transition"
                       style="background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-title)"
                       name="subject"/>
            </div>
            <div>
                <label class="block font-mono text-sm mb-1" style="color:var(--color-title)">Message</label>
                <textarea rows="4" placeholder="Your message here..."
                          class="w-full rounded-lg px-4 py-2 outline-none transition resize-none"
                          style="background:var(--color-bg); border:1px solid var(--color-border); color:var(--color-title)"
                          name="message" required></textarea>
            </div>
            <button type="submit"
                    class="[background-color:var(--color-primary)] text-white rounded-lg py-2 font-semibold hover:opacity-90 transition mt-4">
                Send Message
            </button>
        </form>
    </div>
</div>
