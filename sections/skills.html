<div class="flex items-center gap-4 mb-2">
    <h2 class="text-3xl font-bold mb-1" style="color:var(--color-title)">Skills</h2>
    <span class="hidden md:inline-block flex-1 h-px" style="background:var(--color-border)"></span>
</div>
<div class="[background-color:var(--color-primary)] w-20 h-1 rounded mb-8"></div>
<div class="mb-8">
    <p class="text-sm mb-4" style="color:var(--color-secondary)">
        Some of my skills and technologies I work with regularly. I am always eager to learn new tools and
        frameworks
    </p>
</div>
<div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-8 justify-items-center items-center">
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-flutter text-blue-400 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Flutter</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-node-js text-green-500 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Node.js</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-angular text-red-500 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Angular</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <img src="assets/icons/ionic.svg" alt="Ionic" class="skill-icon w-12 h-12"/>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Ionic</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-js-square text-yellow-400 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">JavaScript</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-python text-blue-600 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Python</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fa-solid fa-database text-red-400 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">SQL DB</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-git-alt text-orange-400 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Git</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fa-brands fa-docker text-[var(--color-primary)] text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Docker</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fa-brands fa-linux text-yellow-500 text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Linux</span>
    </div>
    <div class="flex flex-col items-center scroll-reveal opacity-0 translate-y-8 transition duration-700">
        <i class="skill-icon fab fa-rust text-[var(--color-title)] text-5xl"></i>
        <span class="text-xs mt-2" style="color:var(--color-secondary)">Rust</span>
    </div>
</div>
